<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Single Source — the Fridge</title>
<style>
  :root { --bg:#0c0c0e; --panel:#141417; --line:#26262b; --txt:#e8e8ea; --dim:#8a8a92; --blue:#54aeff; --amber:#f5a524; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:13px/1.4 -apple-system,"Segoe UI",Inter,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; letter-spacing:.14em; color:var(--blue); text-shadow:0 0 12px #54aeff77; font-weight:900; }
  header h1 span { color:var(--txt); text-shadow:none; }
  header h1 em { color:var(--amber); font-style:normal; text-shadow:none; }
  header .sp { flex:1; }
  select, button, input { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:5px 9px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--dim); }
  button.primary { background:var(--blue); border-color:var(--blue); color:#06111f; font-weight:800; }
  a.lnk { color:var(--dim); text-decoration:none; border:1px solid var(--line); border-radius:6px; padding:5px 9px; }
  main { flex:1; display:grid; grid-template-columns:190px 1fr; min-height:0; }
  aside { border-right:1px solid var(--line); overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:6px; }
  aside h2 { font-size:10px; letter-spacing:.25em; color:var(--dim); text-transform:uppercase; padding:4px 2px 6px; }
  .mag { border-radius:8px; padding:8px 10px; font-weight:900; letter-spacing:.06em; color:#111; text-align:center; cursor:grab; user-select:none;
         box-shadow: inset 0 -3px 0 #0003, 0 2px 4px #0006; transform:rotate(var(--r,0deg)); font-size:12px; }
  .mag:active { cursor:grabbing; }
  .mag.square { background:#fff; color:#333; border:2px dashed #999; }
  .hint { color:var(--dim); font-size:11px; padding:8px 2px; line-height:1.5; }
  #wrap { overflow:auto; position:relative; background:#0a0a0c; }
  #door { position:relative; width:1280px; min-height:1800px; margin:20px auto 60px; background:#f3f3f5; border-radius:18px;
          box-shadow: 0 0 0 10px #d9d9de, 0 30px 80px #0009; background-image: linear-gradient(#e6e6ea 1px, transparent 1px), linear-gradient(90deg, #e6e6ea 1px, transparent 1px); background-size:40px 40px; }
  #door.empty::after { content:'drag a magnet here · double-click a block to edit its text · corner to resize · ⌫ to remove'; position:absolute; inset:40% 0 auto; text-align:center; color:#9a9aa2; font-size:14px; }
  .blk { position:absolute; border-radius:8px; color:#111; font-weight:800; letter-spacing:.04em; box-shadow: inset 0 -3px 0 #0002, 0 2px 6px #0004;
         display:flex; align-items:center; justify-content:center; text-align:center; padding:8px 12px; cursor:move; user-select:none; overflow:hidden; }
  .blk .lab { position:absolute; top:4px; left:8px; font-size:9px; letter-spacing:.2em; opacity:.55; }
  .blk .txt { white-space:pre-wrap; word-break:break-word; font-size:14px; line-height:1.3; }
  .blk.text { background:transparent; box-shadow:none; color:#222; font-weight:600; justify-content:flex-start; align-items:flex-start; text-align:left; }
  .blk.text .txt { font-size:16px; }
  .blk.square { background:#fff; border:2px solid #444; box-shadow:none; }
  .blk.columns .txt { display:none; }
  .blk.columns .cols { position:absolute; inset:24px 8px 8px; display:grid; gap:8px; }
  .blk.columns .cols div { background:#fff8; border:1px dashed #0006; border-radius:6px; }
  .blk.sel { outline:3px solid var(--blue); outline-offset:2px; }
  .blk .rs { position:absolute; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize; background:linear-gradient(135deg, transparent 50%, #0008 50%); border-radius:0 0 8px 0; }
  .blk .by { position:absolute; right:6px; top:4px; font-size:9px; opacity:.5; font-weight:600; }
  .blk .cbtn { position:absolute; left:8px; bottom:6px; display:none; gap:4px; }
  .blk.sel.columns .cbtn { display:flex; }
  .blk .cbtn button { padding:0 7px; font-size:12px; line-height:18px; }
  #edit { position:absolute; display:none; z-index:5; background:#fff; color:#111; border:2px solid var(--blue); border-radius:8px; padding:8px 10px; font:inherit; font-size:14px; min-width:160px; resize:both; }
</style>
</head>
<body>
<header>
  <h1>SINGLE <span>SOURCE</span> · <em>FRIDGE</em></h1>
  <select id="pages"></select>
  <button id="newPage">+ page</button>
  <button id="renamePage" title="rename this page">✎</button>
  <span class="sp"></span>
  <span id="who" style="color:var(--dim);font-size:11px"></span>
  <button id="post" class="primary" title="drop a link to this page in the team chat">Post to chat</button>
  <button id="meBtn">You: <b id="meName"></b></button>
  <a class="lnk" href="/">← room</a>
</header>
<main>
  <aside>
    <h2>Magnets</h2>
    <div id="palette"></div>
    <div class="hint">Click a magnet to drop it, or drag it onto the door. Everyone sees the same fridge — go wild, then iterate.</div>
  </aside>
  <div id="wrap"><div id="door" class="empty"></div><textarea id="edit"></textarea></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const MAGNETS = [
  ['hero','#3b82f6'],['navbar','#22c55e'],['image','#f9a8d4'],['text','#a78bfa'],['button','#ef4444'],
  ['square','#ffffff'],['columns','#facc15'],['form','#fb923c'],['footer','#3b82f6'],['video','#22d3ee'],
  ['gallery','#4ade80'],['pricing','#facc15'],['cta','#facc15'],['menu','#fb923c'],['sidebar','#22c55e'],
  ['card','#f9a8d4'],['faq','#8b5cf6'],['testimonials','#f9a8d4'],['search','#f9a8d4'],['map','#22c55e'],
  ['blog','#3b82f6'],['contact','#ef4444'],['calendar','#fb923c'],['carousel','#3b82f6'],['icon','#a78bfa'],
];
const COLOR = Object.fromEntries(MAGNETS);
const DEF = { hero:[1000,260,'Big headline. One line of promise.'], navbar:[1000,56,'Logo · Link · Link · Link · Button'], image:[320,220,''], text:[420,80,'Body copy goes here.'],
  button:[180,48,'Do the thing'], square:[200,200,''], columns:[1000,240,''], form:[380,260,'Name · Email · Message · Send'], footer:[1000,120,'© you · links · socials'],
  video:[560,315,'▶'], gallery:[1000,300,''], pricing:[1000,360,'Free · Pro · Studio'], cta:[600,120,'Join the resistance'], menu:[220,300,'Home · Work · About'],
  sidebar:[240,600,''], card:[300,200,'Title · a line of text'], faq:[800,300,'Q? A.'], testimonials:[1000,200,'"quote" — name'], search:[360,44,'🔍 search'],
  map:[500,300,'🗺'], blog:[700,400,''], contact:[400,300,''], calendar:[400,360,''], carousel:[1000,300,'◂ ▸'], icon:[64,64,'★'] };

let me = localStorage.getItem('ss.me') || 'adam';
let pages = {}, pid = location.hash.slice(1) || null, drag = null, sel = null, editing = null, dirty = new Set();
const door = $('#door');

async function api(path, body) {
  const r = await fetch(path, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) } : undefined);
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
function page() { return pages[pid]; }

// palette
$('#palette').innerHTML = MAGNETS.map(([t,c],i) => `<div class="mag ${t}" draggable="true" data-t="${t}" style="background:${c};--r:${((i%5)-2)*1.2}deg">${t.toUpperCase()}</div>`).join('');
$('#palette').addEventListener('click', (e) => { const m = e.target.closest('.mag'); if (m) addBlock(m.dataset.t, 60 + (page()?.blocks.length||0)*24 % 300, 60 + (page()?.blocks.length||0)*32 % 600); });
$('#palette').addEventListener('dragstart', (e) => { const m = e.target.closest('.mag'); if (m) e.dataTransfer.setData('t', m.dataset.t); });
door.addEventListener('dragover', (e) => e.preventDefault());
door.addEventListener('drop', (e) => { e.preventDefault(); const t = e.dataTransfer.getData('t'); if (!t) return; const r = door.getBoundingClientRect(); addBlock(t, e.clientX - r.left - 20, e.clientY - r.top - 20); });

async function ensurePage() {
  if (pid && pages[pid]) return;
  const name = prompt('Name this page (e.g. "landing v2", "settings screen")', 'untitled'); if (!name) return;
  const p = await api('/api/fridge', { op:'page', page:name, by:me }); pid = p.id; location.hash = pid; await load();
}
async function addBlock(type, x, y) {
  await ensurePage(); if (!page()) return;
  const [w,h,text] = DEF[type] || [200,80,''];
  const b = await api('/api/fridge', { op:'block', page:pid, by:me, block:{ type, text, x:Math.max(0,Math.round(x)), y:Math.max(0,Math.round(y)), w, h, cols: type==='columns'?3:0 } });
  page().blocks.push(b); render(); sel = b.id; render();
}
async function saveBlock(b) { dirty.add(b.id); try { await api('/api/fridge', { op:'block', page:pid, by:me, block:b }); } finally { setTimeout(() => dirty.delete(b.id), 2500); } }
async function removeBlock(id) { page().blocks = page().blocks.filter(b => b.id !== id); render(); await api('/api/fridge', { op:'remove', page:pid, id, by:me }); }

function render() {
  const p = page();
  $('#pages').innerHTML = Object.values(pages).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).map(x => `<option value="${x.id}" ${x.id===pid?'selected':''}>${esc(x.name)} · ${x.blocks.length}</option>`).join('') || '<option value="">(no pages yet)</option>';
  $('#meName').textContent = me;
  $('#who').textContent = p ? `by ${p.by} · ${p.blocks.length} blocks · updated ${p.updatedAt.slice(11,16)}` : '';
  door.classList.toggle('empty', !p || !p.blocks.length);
  const keep = new Set();
  for (const b of (p?.blocks || [])) {
    keep.add(b.id);
    let el = door.querySelector(`[data-id="${b.id}"]`);
    if (drag && drag.id === b.id) continue; // don't fight my own drag
    if (!el) { el = document.createElement('div'); el.dataset.id = b.id; door.appendChild(el); }
    el.className = `blk ${b.type} ${sel===b.id?'sel':''}`;
    el.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;background:${b.type==='text'?'transparent':(COLOR[b.type]||'#ddd')}`;
    el.innerHTML = `<span class="lab">${esc(b.type)}</span><span class="by">${esc(b.editedBy || b.by || '')}</span><div class="txt">${esc(b.text)}</div>` +
      (b.type==='columns' ? `<div class="cols" style="grid-template-columns:repeat(${b.cols||3},1fr)">${'<div></div>'.repeat(b.cols||3)}</div><div class="cbtn"><button data-c="-1">−</button><button data-c="1">+</button></div>` : '') +
      `<div class="rs"></div>`;
  }
  for (const el of [...door.querySelectorAll('.blk')]) if (!keep.has(el.dataset.id)) el.remove();
}

// move / resize
door.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.blk'); if (!el) { sel = null; render(); return; }
  const b = page().blocks.find(x => x.id === el.dataset.id); if (!b) return;
  if (e.target.closest('.cbtn')) return;
  sel = b.id; render();
  const resize = e.target.classList.contains('rs');
  drag = { id:b.id, b, resize, sx:e.clientX, sy:e.clientY, ox:b.x, oy:b.y, ow:b.w, oh:b.h, el };
  el.setPointerCapture(e.pointerId);
});
door.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, b = drag.b;
  if (drag.resize) { b.w = Math.max(24, Math.round(drag.ow + dx)); b.h = Math.max(24, Math.round(drag.oh + dy)); }
  else { b.x = Math.max(0, Math.round(drag.ox + dx)); b.y = Math.max(0, Math.round(drag.oy + dy)); }
  drag.el.style.left = b.x+'px'; drag.el.style.top = b.y+'px'; drag.el.style.width = b.w+'px'; drag.el.style.height = b.h+'px';
});
door.addEventListener('pointerup', () => { if (!drag) return; const b = drag.b; drag = null; saveBlock(b); });
door.addEventListener('click', (e) => {
  const c = e.target.closest('.cbtn button'); if (!c) return;
  const b = page().blocks.find(x => x.id === e.target.closest('.blk').dataset.id);
  b.cols = Math.max(1, Math.min(6, (b.cols||3) + Number(c.dataset.c))); render(); saveBlock(b);
});
// edit text
door.addEventListener('dblclick', (e) => {
  const el = e.target.closest('.blk'); if (!el) return;
  const b = page().blocks.find(x => x.id === el.dataset.id); if (!b || b.type === 'columns') return;
  editing = b; const ed = $('#edit');
  ed.style.display = 'block'; ed.style.left = b.x + 'px'; ed.style.top = b.y + 'px'; ed.style.width = Math.max(160, b.w) + 'px'; ed.style.height = Math.max(60, b.h) + 'px';
  ed.value = b.text; ed.focus();
});
$('#edit').addEventListener('blur', () => { const ed = $('#edit'); if (!editing) return; editing.text = ed.value; ed.style.display = 'none'; const b = editing; editing = null; render(); saveBlock(b); });
$('#edit').addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#edit').blur(); });
document.addEventListener('keydown', (e) => { if ((e.key === 'Backspace' || e.key === 'Delete') && sel && !editing && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); removeBlock(sel); sel = null; } });

// pages
$('#pages').onchange = (e) => { pid = e.target.value; location.hash = pid; sel = null; render(); };
$('#newPage').onclick = async () => { pid = null; await ensurePage(); };
$('#renamePage').onclick = async () => { if (!page()) return; const n = prompt('Rename page', page().name); if (n) { await api('/api/fridge', { op:'rename', page:pid, name:n, by:me }); await load(); } };
$('#post').onclick = async () => { if (!page()) return; const t = prompt('Say something with the link (optional)', 'take a look, tear it apart'); if (t === null) return; await api('/api/fridge', { op:'post', page:pid, by:me, block:{ text:t } }); };
$('#meBtn').onclick = () => { const v = prompt('Who are you?', me); if (v) { me = v.trim().toLowerCase(); localStorage.setItem('ss.me', me); render(); } };
window.addEventListener('hashchange', () => { pid = location.hash.slice(1) || pid; render(); });

async function load() {
  try {
    const f = await api('/api/fridge');
    // keep blocks I just saved from being clobbered by a stale poll
    for (const p of Object.values(f.pages)) if (pages[p.id]) for (const b of p.blocks) { const mine = pages[p.id].blocks.find(x => x.id === b.id); if (mine && dirty.has(b.id)) Object.assign(b, mine); }
    pages = f.pages;
    if (!pid || !pages[pid]) { const first = Object.values(pages).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt))[0]; if (first) { pid = first.id; location.hash = pid; } }
    render();
  } catch (e) { $('#who').textContent = 'server offline — bus ss'; }
}
load(); setInterval(load, 4000);
</script>
</body>
</html>
