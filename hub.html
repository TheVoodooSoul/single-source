<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Agent Status Hub</title>
<style>
  :root {
    --bg: #0c0c0e;
    --panel: #141417;
    --line: #26262b;
    --txt: #e8e8ea;
    --dim: #8a8a92;
    --red: #e5484d;
    --yellow: #f5a524;
    --green: #46a758;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--txt);
    font: 13px/1.45 "SF Mono", Menlo, ui-monospace, monospace;
    min-height: 100vh;
    padding: 20px 24px 32px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--txt);
  }
  .totals {
    color: var(--dim);
    font-size: 12px;
  }
  .totals strong { color: var(--yellow); font-weight: 700; }
  .legend {
    display: flex;
    gap: 14px;
    margin-bottom: 18px;
    color: var(--dim);
    font-size: 11px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px color-mix(in srgb, currentColor 55%, transparent);
  }
  .dot.red { background: var(--red); color: var(--red); }
  .dot.yellow { background: var(--yellow); color: var(--yellow); }
  .dot.green { background: var(--green); color: var(--green); }
  .agents {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 140px;
  }
  .card .top {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .light {
    width: 28px; height: 28px; border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 14px color-mix(in srgb, currentColor 50%, transparent);
  }
  .light.red { background: var(--red); color: var(--red); }
  .light.yellow { background: var(--yellow); color: var(--yellow); }
  .light.green { background: var(--green); color: var(--green); }
  .name { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
  .label { color: var(--dim); font-size: 12px; word-break: break-word; min-height: 1.4em; }
  .meta { margin-top: auto; font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; }
  .meta .subs { color: var(--txt); }
  h2 {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 10px;
  }
  #feed { display: flex; flex-direction: column; gap: 6px; }
  .msg {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .msg .hd { font-size: 11px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; }
  .msg .hd b { color: var(--txt); }
  .msg .sub { font-weight: 700; margin-top: 2px; }
  .msg .bd { color: #c9c9cf; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .err { color: var(--red); font-size: 12px; margin-bottom: 12px; }
  #issues { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
  .issue { border-left: 3px solid var(--yellow); }
  .issue.high { border-left-color: var(--red); }
  .issue.low { border-left-color: var(--dim); }
  .issue .id { color: var(--dim); font-size: 10px; user-select: all; }
  h2 .count { color: var(--red); }
  .msg.kind-issue .hd b + span, .msg.kind-fixed .sub { color: var(--green); }
</style>
</head>
<body>
<header>
  <h1>Agent Status Hub</h1>
  <div class="totals" id="totals">—</div>
</header>
<div class="legend">
  <span><i class="dot yellow"></i> yellow = mid work</span>
  <span><i class="dot green"></i> green = done / ready</span>
  <span><i class="dot red"></i> red = idle / needs help</span>
</div>
<div id="err" class="err" hidden></div>
<section class="agents" id="agents"></section>
<section>
  <h2>Open issues <span class="count" id="issueCount"></span></h2>
  <div id="issues"></div>
</section>
<section>
  <h2>Recent bus</h2>
  <div id="feed"></div>
</section>
<script>
const AGENTS = ['cursor', 'claude-code', 'adam'];
const POLL_MS = 2500;

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

function ago(iso) {
  if (!iso) return '—';
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return iso;
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

function renderAgents(data) {
  const map = (data && data.agents) || {};
  let totalSubs = 0;
  const el = document.getElementById('agents');
  el.innerHTML = AGENTS.map((id) => {
    const a = map[id] || { light: 'red', label: 'no status', subagents: 0, updatedAt: null };
    const light = ['yellow', 'green', 'red'].includes(a.light) ? a.light : 'red';
    const subs = Number(a.subagents) || 0;
    totalSubs += subs;
    return (
      '<article class="card">' +
        '<div class="top"><div class="light ' + light + '" title="' + light + '"></div>' +
        '<div class="name">' + esc(id) + '</div></div>' +
        '<div class="label">' + esc(a.label || '') + '</div>' +
        '<div class="meta"><span class="subs">' + subs + ' subagent' + (subs === 1 ? '' : 's') + '</span>' +
        '<span>' + esc(ago(a.updatedAt)) + '</span></div>' +
      '</article>'
    );
  }).join('');
  document.getElementById('totals').innerHTML =
    '<strong>' + totalSubs + '</strong> subagent' + (totalSubs === 1 ? '' : 's') + ' rocking';
}

function renderIssues(list) {
  const el = document.getElementById('issues');
  const cnt = document.getElementById('issueCount');
  if (!list || !list.length) {
    cnt.textContent = '';
    el.innerHTML = '<div class="msg"><div class="bd" style="color:var(--dim)">None open. Report one: bus issue --from &lt;agent&gt; --sev high --subject "…" --body "…"</div></div>';
    return;
  }
  cnt.textContent = '(' + list.length + ')';
  el.innerHTML = list.slice().reverse().map((m) => {
    const sev = /^\[(low|med|high)\]/.exec(m.subject || '');
    const cls = sev ? sev[1] : 'med';
    return (
      '<div class="msg issue ' + cls + '">' +
        '<div class="hd"><b>' + esc(m.from) + '</b> · ' + esc((m.ts || '').slice(0, 16).replace('T', ' ')) +
        ' · <span class="id">' + esc(m.id) + '</span></div>' +
        '<div class="sub">' + esc(m.subject || '') + '</div>' +
        '<div class="bd">' + esc(m.body || '') + '</div>' +
        '<div class="hd" style="margin-top:4px">close: bus fixed --from &lt;agent&gt; --re ' + esc(m.id) + '</div>' +
      '</div>'
    );
  }).join('');
}

function renderMessages(lines) {
  const feed = document.getElementById('feed');
  if (!lines || !lines.length) {
    feed.innerHTML = '<div class="msg"><div class="bd" style="color:var(--dim)">No messages yet.</div></div>';
    return;
  }
  feed.innerHTML = lines.slice().reverse().map((m) => {
    return (
      '<div class="msg kind-' + esc(m.kind || 'note') + '">' +
        '<div class="hd"><b>' + esc(m.from) + '</b>→' + esc(m.to === '*' ? 'all' : m.to) +
        ' · ' + esc(m.kind || 'note') +
        ' · <span>' + esc((m.ts || '').slice(11, 19)) + '</span></div>' +
        (m.subject ? '<div class="sub">' + esc(m.subject) + '</div>' : '') +
        '<div class="bd">' + esc(m.body || '') + '</div>' +
      '</div>'
    );
  }).join('');
}

async function tick() {
  const err = document.getElementById('err');
  try {
    const r = await fetch('/api/hub').then((x) => {
      if (!x.ok) throw new Error('hub ' + x.status);
      return x.json();
    });
    err.hidden = true;
    renderAgents(r.status);
    renderIssues(r.issues || []);
    renderMessages(r.messages || []);
  } catch (e) {
    err.hidden = false;
    err.textContent = 'Hub offline — start with: node hub-server.mjs';
  }
  setTimeout(tick, POLL_MS);
}

tick();
</script>
</body>
</html>
